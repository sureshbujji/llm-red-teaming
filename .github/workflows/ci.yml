name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Smoke test red-team campaign (mock mode, no API key)
        run: python src/run_redteam.py
      - name: Smoke test defense mode
        run: python src/run_redteam.py --with-defense src.defenses.moderate --out /tmp/redteam_defense.md
